name: ip-deputy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ip_deputy}
      POSTGRES_USER: ${POSTGRES_USER:-ip_deputy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=uk-UA"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKERHUB_USERNAME:-navatusein}/ip-deputy-api:${API_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: ${POSTGRES_DB:-ip_deputy}
      DATABASE_USER: ${POSTGRES_USER:-ip_deputy}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_ACCESS_KEY: ${JWT_ACCESS_KEY:?JWT_ACCESS_KEY is required}
      JWT_REFRESH_KEY: ${JWT_REFRESH_KEY:?JWT_REFRESH_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-ip-deputy}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ip-deputy}
      BOT_API_TOKEN: ${BOT_API_TOKEN:?BOT_API_TOKEN is required}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      INITIAL_ADMIN_LOGIN: ${INITIAL_ADMIN_LOGIN:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${FRONTEND_URL:?FRONTEND_URL is required}
      TIME_ZONE: ${TIME_ZONE:-Europe/Kyiv}
    ports:
      - "${API_PORT:-8000}:8080"

  bot:
    image: ${DOCKERHUB_USERNAME:-navatusein}/ip-deputy-bot:${BOT_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_TOKEN: ${BOT_API_TOKEN}
      API_URL: http://api:8080/api/bot
      FRONTEND_URL: ${FRONTEND_URL}
      WEBHOOK_URL: ${BOT_WEBHOOK_URL:?BOT_WEBHOOK_URL is required}
      WEBHOOK_PATH: ${BOT_WEBHOOK_PATH:-/bot-webhook}
      WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:?BOT_WEBHOOK_SECRET is required}
      TIME_ZONE: ${TIME_ZONE:-Europe/Kyiv}
    ports:
      - "${BOT_PORT:-7540}:7540"

  frontend:
    image: ${DOCKERHUB_USERNAME:-navatusein}/ip-deputy-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: ${FRONTEND_URL}/api
      GROUP_NAME: ${GROUP_NAME:-IP-41}
      TIME_ZONE: ${TIME_ZONE:-Europe/Kyiv}
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db-data:
